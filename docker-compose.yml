services:
  dayleaf:
    image: ghcr.io/t0n003c/dayleaf:latest
    # To build from source instead of pulling the published image,
    # comment out the line above and uncomment the next one:
    # build: .
    container_name: dayleaf
    ports:
      - "3010:3000"
    volumes:
      - ./dayleaf-data:/data
    restart: unless-stopped
    # Dayleaf needs no .env file — all app settings (AI keys, reminders,
    # your name) are configured in the UI and stored inside /data.
    # The only supported env vars, shown with their defaults:
    # environment:
    #   - PORT=3000        # port inside the container
    #   - DATA_DIR=/data   # where the database and photos live
