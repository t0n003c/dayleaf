services:
  dayleaf:
    image: ghcr.io/t0n003c/dayleaf:latest
    # To build from source instead of pulling the published image,
    # comment out the line above and uncomment the next one:
    # build: .
    container_name: dayleaf
    ports:
      - "3010:3000"
    volumes:
      - ./dayleaf-data:/data
    restart: unless-stopped
    # Hardening (optional but recommended):
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The container runs as the non-root `node` user; ensure your data dir is
    # writable by UID 1000 (e.g. `chown -R 1000:1000 ./dayleaf-data`).
    # Dayleaf needs no .env file — all app settings (AI keys, reminders,
    # your name) are configured in the UI and stored inside /data.
    # The only supported env vars, shown with their defaults:
    # environment:
    #   - PORT=3000        # port inside the container
    #   - DATA_DIR=/data   # where the database and photos live
    #   - PUBLIC_ORIGIN=https://journal.example.com
    #     # ^ only needed if biometric/passkey setup complains about a
    #     #   wrong origin and your proxy mangles X-Forwarded-Proto
    #
    # Brute-force protection (defaults shown; rarely needs tuning):
    #   - MAX_LOGIN_ATTEMPTS=5      # failed tries per IP before cooldown
    #   - MAX_GLOBAL_ATTEMPTS=15    # failed tries from anywhere before cooldown
    #   - LOGIN_WINDOW_MINUTES=15   # how far back failures are counted
    #   - LOCKOUT_MINUTES=15        # cooldown length once tripped
